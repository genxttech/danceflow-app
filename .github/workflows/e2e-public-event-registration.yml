name: Public Event Registration E2E

# Release regression gate for the Public Event Registration flow
# (registration -> required-document signing -> payment initiation).
# See e2e/README.md for what this harness does and does not cover.
#
# Two independent jobs:
#   1. static-checks: typecheck/build/lint/full Vitest -- has no external
#      dependencies, runs unconditionally.
#   2. browser-e2e: the real Playwright suite against a real, non-production
#      Supabase instance. Gated behind repo secrets being present (see that
#      job's own comment for exactly why, and the one remaining
#      infrastructure prerequisite this repo doesn't have yet).

on:
  pull_request:
    paths:
      - "src/app/events/**"
      - "src/app/discover/events/**"
      - "src/app/sign/**"
      - "src/app/api/events/cart/**"
      # Whole directory, not individual files: every file here (PDF
      # rendering, signing-token/storage-path helpers, checkpoint
      # advancement, rate limiting) is load-bearing for the signing flow
      # this harness tests, and a per-file list silently misses new
      # additions to this directory.
      - "src/lib/documents/**"
      - "src/lib/events/event-order-payment.ts"
      - "src/lib/payments/**"
      - "e2e/**"
      - "src/lib/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e-public-event-registration.yml"
  workflow_dispatch: {}

# Never grant this workflow more than it needs.
permissions:
  contents: read

jobs:
  static-checks:
    name: Typecheck, build, lint, unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the changed-file lint step below can diff against the
          # PR's base commit -- the default fetch-depth: 1 (single commit)
          # would leave that ref unavailable locally.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Full Vitest suite
        run: npx vitest run

      - name: Production build
        run: npm run build

      # Independent pre-commit review, Blocker B1: `npx eslint .` (lint the
      # entire repo) fails unconditionally today -- this repo has hundreds
      # of pre-existing lint errors in files with no relation to any given
      # PR, so an unscoped lint step is permanently red and teaches nothing.
      # Lints only the .ts/.tsx files this PR actually changed instead: a
      # PR with a lint error in a file it touches still fails; a PR that
      # never touches a file with pre-existing debt does not inherit that
      # debt. Only meaningful for `pull_request` (a real base commit to
      # diff against exists); `workflow_dispatch` has no PR to diff, so this
      # step doesn't run for it -- the other static checks above still do.
      #
      # Uses NUL-delimited git output (`-z`) plus bash's `mapfile -d ''`
      # instead of piping through `xargs`: `xargs`' default whitespace-based
      # splitting breaks on filenames containing spaces, and even
      # `xargs -0` still re-invokes a subshell per batch in a way that's
      # easy to get subtly wrong with quoting -- `mapfile` reads NUL-
      # delimited entries directly into a bash array with no re-parsing
      # step, so a filename with spaces, quotes, or other shell-special
      # characters is never mis-split.
      - name: Lint changed files only
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          mapfile -d '' -t changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- '*.ts' '*.tsx'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed .ts/.tsx files in this PR -- nothing to lint."
            exit 0
          fi

          echo "Linting ${#changed_files[@]} changed file(s):"
          printf '  %s\n' "${changed_files[@]}"
          npx eslint "${changed_files[@]}"

  # Reads whether the secrets this job needs are configured, WITHOUT ever
  # printing or otherwise exposing their values -- this is the fail-closed
  # gate: if they're absent, browser-e2e is skipped outright rather than
  # running with any fallback/default target, which could only ever be
  # unsafe (there is no safe default for "which Supabase instance").
  check-e2e-env:
    name: Check E2E environment is configured
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.E2E_SUPABASE_URL }}" ] && [ -n "${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_SUPABASE_URL / E2E_SUPABASE_SERVICE_ROLE_KEY are not configured as repo secrets -- skipping browser-e2e (fail-closed: no default target exists, so this job does not run rather than guessing one)."
          fi

  browser-e2e:
    name: Playwright E2E (registration/signing/payment-initiation)
    needs: check-e2e-env
    if: needs.check-e2e-env.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          # Points the BUILD at the same non-production Supabase instance the
          # E2E run itself targets -- never production, and never a default,
          # since this whole job is skipped above when these aren't set.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

      - name: Start the app (production build)
        run: npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

      - name: Wait for the app to respond
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run the Public Event Registration E2E suite
        run: npx playwright test e2e/tests/
        env:
          # E2E_BASE_URL is intentionally always localhost here -- this is
          # also enforced independently, fail-closed, by
          # src/lib/e2e/guards.ts's assertE2EBaseUrlIsSafe regardless of what
          # this value is ever changed to; it hard-blocks the known
          # production domains even if someone tries to point it there.
          E2E_BASE_URL: "http://localhost:3000"
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          # Independent pre-commit review, Blocker B2: only ever sourced from
          # this explicit secret -- an unset secret resolves to an empty
          # string, which src/lib/e2e/guards.ts's assertE2ESupabaseUrlIsSafe
          # treats as "no extra hosts allowed", never as "allow anything".
          # There is no default value here that could make an arbitrary
          # hosted Supabase project safe.
          E2E_SUPABASE_ALLOW_HOSTS: ${{ secrets.E2E_SUPABASE_ALLOW_HOSTS }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# ---------------------------------------------------------------------------
# Remaining prerequisite (browser-e2e is fully scaffolded but cannot run
# until this is resolved -- see the task's own instruction to identify this
# plainly rather than weakening any safety check to work around it):
#
# This repo cannot bootstrap a from-scratch local Docker Supabase instance
# inside GitHub Actions today. Two things are missing, neither of which
# exists anywhere in this repo currently:
#   1. A `supabase/config.toml` -- required by `supabase start`/the
#      Supabase CLI to even know what to bring up (ports, service versions,
#      etc.). This repo's `supabase/` directory only has CLI-linkage cache
#      (`.temp/`), not a config.
#   2. A base-schema snapshot/dump. `src/lib/supabase/migrations/` is
#      INCREMENTAL only -- e2e/README.md already documents that the base
#      tables the fixture writes to (studios, events, event_ticket_types,
#      and by extension everything else this flow touches) "predate
#      migration tracking". That base schema currently exists only inside
#      the already-running local Docker staging Postgres volume on a
#      developer machine (C:\Dev\danceflow-local-staging\), which is
#      outside this repo and cannot be reproduced by a GitHub Actions
#      runner from source alone.
#
# Until one of those is provided (a checked-in schema dump this workflow
# could apply to a fresh `postgres:` service container, or a
# `supabase/config.toml` plus `supabase db push`), `browser-e2e` instead
# targets an EXTERNALLY-PROVIDED, already-migrated, non-production Supabase
# project via E2E_SUPABASE_URL/E2E_SUPABASE_SERVICE_ROLE_KEY repo secrets --
# any such project works (local Docker once the above exists, or a
# dedicated CI/staging Supabase project), and the job stays fail-closed
# (skipped, not run-with-a-default) until those secrets exist.
# ---------------------------------------------------------------------------
