name: Secret scan

# Scans the commits each push and pull request introduces, with a pinned gitleaks release whose checksum is verified
# before it runs. No third-party action and no secrets. Not a required check. See docs/ops/Secret_Scanning.md.

on:
  pull_request: {}
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    if: github.event_name == 'pull_request' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the range selection
        run: node --test scripts/security/__tests__/gitleaks-range.test.mjs
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks version
      - name: Self-test the allowlist on synthetic strings
        run: node scripts/security/gitleaks-selftest.mjs "$RUNNER_TEMP/gitleaks"
      - name: Scan the commits this event introduces
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/gitleaks-range.sh)"
          # $range is one or more revision arguments made of validated commit ids and the default branch ref.
          echo "scanning $(git rev-list --count $range) commit(s): $range"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="$range" \
            --ignore-gitleaks-allow --redact --verbose --no-banner
      - name: Current tree summary (report only, counts per rule)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          [ -x "$RUNNER_TEMP/gitleaks" ] || { echo "gitleaks was not installed; no summary"; exit 0; }
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner \
            --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/tree.json"
          node -e '
            const rows = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const by = {};
            for (const r of rows) by[r.RuleID] = (by[r.RuleID] || 0) + 1;
            console.log("findings outside the allowlist in the current tree: " + rows.length);
            for (const [rule, n] of Object.entries(by).sort()) console.log("  " + rule + ": " + n);
          ' "$RUNNER_TEMP/tree.json"
