name: Mobile Apps

# Required merge check for the Expo apps in mobile/student and mobile/business.
# Runs on EVERY pull request (no paths filter) so the required check always reports;
# an app directory that does not exist on the branch is skipped and the check still passes.
# No secrets, no device, no EAS: typecheck, jest tests and the Expo SDK version check.

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile apps typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Typecheck, test and check Expo versions for each app present
        env:
          CI: "1"
        run: |
          set -euo pipefail
          ran=0
          for app in student business; do
            dir="mobile/$app"
            if [ ! -f "$dir/package.json" ]; then
              echo "::notice::$dir is not on this branch; skipped"
              continue
            fi
            echo "::group::$dir"
            (
              cd "$dir"
              npm ci --no-audit --no-fund
              npm run typecheck
              npm test -- --ci
              npm run --if-present check:deps
            )
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "checked $ran app(s)"
